<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather - Gjilan</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <div class="weather-app">
      <div class="app-header">
        <h1 class="app-title">Weather - Gjilan</h1>
        <a href="index.html" class="search-button">Back to Pristina</a>
      </div>

      <div class="current-weather">
        <h2 class="location">Gjilan, Kosovo</h2>
        <div class="date">Wednesday, June 25, 2025</div>
        <div class="weather-icon">⛅</div>
        <div class="temperature">26</div>
        <div class="weather-description">Partly Cloudy</div>
        <div class="weather-details">
          <div class="detail-item"><div class="detail-value">60%</div><div class="detail-label">Humidity</div></div>
          <div class="detail-item"><div class="detail-value">10 km/h</div><div class="detail-label">Wind</div></div>
          <div class="detail-item"><div class="detail-value">1009 hPa</div><div class="detail-label">Pressure</div></div>
          <div class="detail-item"><div class="detail-value">8:22 PM</div><div class="detail-label">Sunset</div></div>
        </div>
      </div>

      <div class="forecast">
        <h3 class="section-title">5-Day Forecast</h3>
        <div class="forecast-items">
          <div class="forecast-item"><div class="forecast-day">Thu</div><div class="forecast-icon">⛅</div><div class="forecast-temp">27° / 17°</div></div>
          <div class="forecast-item"><div class="forecast-day">Fri</div><div class="forecast-icon">🌤️</div><div class="forecast-temp">28° / 18°</div></div>
          <div class="forecast-item"><div class="forecast-day">Sat</div><div class="forecast-icon">🌦️</div><div class="forecast-temp">26° / 16°</div></div>
          <div class="forecast-item"><div class="forecast-day">Sun</div><div class="forecast-icon">☀️</div><div class="forecast-temp">29° / 19°</div></div>
          <div class="forecast-item"><div class="forecast-day">Mon</div><div class="forecast-icon">☀️</div><div class="forecast-temp">30° / 20°</div></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Weather - Pristina</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="navbar">
        <a href="index.html">Pristina</a>
        <a href="gjakova.html">Gjakova</a>
        <a href="peja.html">Peja</a>
        <a href="prizren.html">Prizren</a>
        <a href="mitrovica.html">Mitrovica</a>
    </div>

    <div class="container">
        <div class="weather-app">
            <div class="app-header">
                <h1 class="app-title">Weather Forecast</h1>
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Search city..." />
                    <button class="search-button">Search</button>
                </div>
            </div>

            <div class="current-weather">
                <h2 class="location">Pristina, Kosovo</h2>
                <div class="date">Wednesday, June 25, 2025</div>
                <div class="weather-icon">🌤️</div>
                <div class="temperature">28</div>
                <div class="weather-description">Partly Cloudy</div>

                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-value">55%</div>
                        <div class="detail-label">Humidity</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-value">10 km/h</div>
                        <div class="detail-label">Wind</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-value">1015 hPa</div>
                        <div class="detail-label">Pressure</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-value">8:12 PM</div>
                        <div class="detail-label">Sunset</div>
                    </div>
                </div>
            </div>

            <div class="forecast">
                <h3 class="section-title">5-Day Forecast</h3>
                <div class="forecast-items">
                    <div class="forecast-item">
                        <div class="forecast-day">Thu</div>
                        <div class="forecast-icon">☀️</div>
                        <div class="forecast-temp">30° / 18°</div>
                    </div>
                    <div class="forecast-item">
                        <div class="forecast-day">Fri</div>
                        <div class="forecast-icon">⛅</div>
                        <div class="forecast-temp">27° / 16°</div>
                    </div>
                    <div class="forecast-item">
                        <div class="forecast-day">Sat</div>
                        <div class="forecast-icon">🌧️</div>
                        <div class="forecast-temp">24° / 15°</div>
                    </div>
                    <div class="forecast-item">
                        <div class="forecast-day">Sun</div>
                        <div class="forecast-icon">🌤️</div>
                        <div class="forecast-temp">26° / 17°</div>
                    </div>
                    <div class="forecast-item">
                        <div class="forecast-day">Mon</div>
                        <div class="forecast-icon">☀️</div>
                        <div class="forecast-temp">31° / 19°</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
